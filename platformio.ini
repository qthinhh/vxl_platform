[platformio]
default_envs = gpio

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude

[env:gpio]
build_flags = ${env.build_flags} -DDEMO_GPIO

[env:uart]
build_flags = ${env.build_flags} -DDEMO_UART

[env:spi]
build_flags = ${env.build_flags} -DDEMO_SPI

[env:i2c]
build_flags = ${env.build_flags} -DDEMO_I2C

[env:adc]
build_flags = ${env.build_flags} -DDEMO_ADC

[env:ac]
build_flags = ${env.build_flags} -DDEMO_AC

[env:pwm]
build_flags = ${env.build_flags} -DDEMO_PWM

[env:timer]
build_flags = ${env.build_flags} -DDEMO_TIMER
